<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Electrical Assets</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border:1px solid #ccc; padding:0.6rem; text-align:left; }
        th { background:#f2f2f2; }
        th a { color:black; text-decoration:none; }
        th a:hover { text-decoration:underline; }

        a.button, button {
            display:inline-block;
            padding:0.4rem 0.8rem;
            margin:0.1rem;
            background:#2980b9;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
            border:none;
            cursor:pointer;
        }
        button.delete-btn { background:#c0392b; }

        .top-bar { margin-bottom:1rem; }
        .filter-box { margin:1rem 0; }
    </style>
</head>
<body>

<h1>Electrical Assets</h1>

<div class="top-bar">
    <a href="/assets/new" class="button">Add Asset</a>
</div>

<!-- FILTER BY STATUS -->
<form method="get" action="/assets" class="filter-box">
    Status:
    <select name="status">
        <option value="">-- any --</option>
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}"
                th:selected="${status == s}">
        </option>
    </select>
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/assets(
                status=${status},
                sortBy='type',
                sortDir=${sortBy == 'type' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Type
                <span th:if="${sortBy == 'type'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>
            <a th:href="@{/assets(
                status=${status},
                sortBy='status',
                sortDir=${sortBy == 'status' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Status
                <span th:if="${sortBy == 'status'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Floor</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${assets}">
        <td th:text="${a.type}"></td>
        <td th:text="${a.status}"></td>
        <td th:text="${a.floor != null ? a.floor.level : 'N/A'}"></td>
        <td>
            <a th:href="@{/assets/{id}(id=${a.id})}" class="button">Details</a>
            <a th:href="@{/assets/{id}/edit(id=${a.id})}" class="button">Edit</a>
            <form th:action="@{/assets/{id}/delete(id=${a.id})}"
                  method="post" style="display:inline">
                <button class="delete-btn" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
