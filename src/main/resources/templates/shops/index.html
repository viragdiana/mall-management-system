<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shops</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.6rem; text-align: left; }
        th { background: #f2f2f2; }
        th a { color: black; text-decoration: none; }
        th a:hover { text-decoration: underline; }

        a.button, button {
            padding: 0.4rem 0.8rem;
            background: #2980b9;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        button.delete-btn { background: #c0392b; }

        .filter-box { margin: 1rem 0; }
    </style>
</head>
<body>

<h1>Shops</h1>

<a href="/shops/new" class="button">Add Shop</a>

<!-- FILTER BY NAME -->
<form method="get" action="/shops" class="filter-box">
    Name:
    <input type="text" name="name" th:value="${name}" />
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/shops(
                name=${name},
                sortBy='name',
                sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Name
                <span th:if="${sortBy == 'name'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>
            <a th:href="@{/shops(
                name=${name},
                sortBy='type',
                sortDir=${sortBy == 'type' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Type
                <span th:if="${sortBy == 'type'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Area (sqm)</th>
        <th>Floor</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="s : ${shops}">
        <td th:text="${s.name}"></td>
        <td th:text="${s.type}"></td>
        <td th:text="${s.areaSqm}"></td>
        <td th:text="${s.floor.level}"></td>
        <td>
            <a th:href="@{/shops/{id}(id=${s.id})}" class="button">Details</a>
            <a th:href="@{/shops/{id}/edit(id=${s.id})}" class="button">Edit</a>
            <form th:action="@{/shops/{id}/delete(id=${s.id})}" method="post" style="display:inline">
                <button class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
