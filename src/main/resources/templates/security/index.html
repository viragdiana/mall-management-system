<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Security Staff</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top:1rem; }
        th, td { border:1px solid #ccc; padding:0.6rem; text-align:left; }
        th { background:#f2f2f2; }
        th a { color:black; text-decoration:none; }
        th a:hover { text-decoration:underline; }

        a.button, button {
            display:inline-block;
            padding:0.4rem 0.8rem;
            margin:0.1rem;
            background:#2980b9;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
            border:none;
            cursor:pointer;
        }
        button.delete-btn { background:#c0392b; }

        .top-bar { margin-bottom:1rem; }
        .filter-box { margin:1rem 0; }
    </style>
</head>
<body>

<h1>Security Staff</h1>

<div class="top-bar">
    <a href="/security-staff/new" class="button">Add Security Staff</a>
</div>

<!-- FILTER BY NAME -->
<form method="get" action="/security-staff" class="filter-box">
    Name:
    <input type="text" name="name" th:value="${name}" />
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/security-staff(
                name=${name},
                sortBy='name',
                sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Name
                <span th:if="${sortBy == 'name'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>
            <a th:href="@{/security-staff(
                name=${name},
                sortBy='badgeNo',
                sortDir=${sortBy == 'badgeNo' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Badge
                <span th:if="${sortBy == 'badgeNo'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="s : ${staffList}">
        <td th:text="${s.name}"></td>
        <td th:text="${s.badgeNo}"></td>
        <td>
            <a th:href="@{/security-staff/{id}(id=${s.id})}" class="button">Details</a>
            <a th:href="@{/security-staff/{id}/edit(id=${s.id})}" class="button">Edit</a>
            <form th:action="@{/security-staff/{id}/delete(id=${s.id})}"
                  method="post" style="display:inline">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
