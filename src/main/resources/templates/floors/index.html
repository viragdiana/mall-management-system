<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Floors</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top:1rem; }
        th, td { border:1px solid #ccc; padding:0.6rem; text-align:left; }
        th { background:#f2f2f2; }
        th a { color:black; text-decoration:none; }
        th a:hover { text-decoration:underline; }

        a.button, button {
            display:inline-block;
            padding:0.4rem 0.8rem;
            margin:0.1rem;
            background:#2980b9;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
            border:none;
            cursor:pointer;
        }
        button.delete-btn { background:#c0392b; }

        .top-bar { margin-bottom:1rem; }
        .filter-box { margin:1rem 0; }
    </style>
</head>
<body>

<h1>Floors</h1>

<div class="top-bar">
    <a href="/floors/new" class="button">+ Add Floor</a>
</div>

<!-- FILTER BY MALL -->
<form method="get" action="/floors" class="filter-box">
    Mall:
    <select name="mallId">
        <option value="">-- any --</option>
        <option th:each="m : ${malls}"
                th:value="${m.id}"
                th:text="${m.name}"
                th:selected="${mallId == m.id}">
        </option>
    </select>
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/floors(
                mallId=${mallId},
                sortBy='level',
                sortDir=${sortBy == 'level' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Level
                <span th:if="${sortBy == 'level'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>
            <a th:href="@{/floors(
                mallId=${mallId},
                sortBy='mall',
                sortDir=${sortBy == 'mall' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Mall
                <span th:if="${sortBy == 'mall'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="f : ${floors}">
        <td th:text="${f.level}"></td>
        <td th:text="${f.mall.name}"></td>
        <td>
            <a th:href="@{/floors/{id}(id=${f.id})}" class="button">Details</a>
            <a th:href="@{/floors/{id}/edit(id=${f.id})}" class="button">Edit</a>
            <form th:action="@{/floors/{id}/delete(id=${f.id})}"
                  method="post" style="display:inline">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
