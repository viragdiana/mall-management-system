<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Assignment</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        form { width: 400px; background:#f9f9f9; padding:1.5rem; border-radius:6px; }
        label { display:block; margin-top:1rem; }
        select { width:100%; padding:0.5rem; margin-top:0.3rem; }
        button {
            margin-top:1rem;
            padding:0.6rem;
            background:#2980b9;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
        a { margin-top:1rem; display:block; }
        .error { color:#c0392b; font-size:0.9rem; }
    </style>
</head>
<body>

<h1>Add Assignment</h1>

<div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

<form th:action="@{/assignments}" th:object="${assignment}" method="post">

    <!-- FLOOR -->
    <label>Floor:</label>
    <select th:field="*{floor.id}" required>
        <option value="">-- select floor --</option>
        <option th:each="f : ${floors}"
                th:value="${f.id}"
                th:text="${f.level}">
        </option>
    </select>

    <!-- STAFF (maintenance only, matches service logic) -->
    <label>Maintenance Staff:</label>
    <select th:field="*{staff.id}" required>
        <option value="">-- select maintenance staff --</option>
        <option th:each="m : ${maintenanceStaff}"
                th:value="${m.id}"
                th:text="${m.name}">
        </option>
    </select>

    <!-- SHIFT (safe binding) -->
    <label>Shift:</label>
    <select name="shift" required>
        <option value="">-- select shift --</option>
        <option th:each="sh : ${shifts}"
                th:value="${sh}"
                th:text="${sh}">
        </option>
    </select>

    <button type="submit">Save</button>
</form>

<a href="/assignments">← Back</a>

</body>
</html>
