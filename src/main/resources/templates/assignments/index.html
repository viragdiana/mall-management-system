<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Assignments</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top:1rem; }
        th, td { border:1px solid #ccc; padding:0.6rem; text-align:left; }
        th { background:#f2f2f2; }
        th a { color:black; text-decoration:none; }
        th a:hover { text-decoration:underline; }

        a.button, button {
            display:inline-block;
            padding:0.4rem 0.8rem;
            margin:0.1rem;
            background:#2980b9;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
            border:none;
            cursor:pointer;
        }
        button.delete-btn { background:#c0392b; }

        .top-bar { margin-bottom:1rem; }
        .filter-box { margin:1rem 0; }
    </style>
</head>
<body>

<h1>Staff Assignments</h1>

<div class="top-bar">
    <a href="/assignments/new" class="button">Add Assignment</a>
</div>

<!-- FILTER BY SHIFT -->
<form method="get" action="/assignments" class="filter-box">
    Shift:
    <select name="shift">
        <option value="">-- any --</option>
        <option th:each="s : ${shifts}"
                th:value="${s}"
                th:text="${s}"
                th:selected="${shift == s}">
        </option>
    </select>
    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/assignments(
                shift=${shift},
                sortBy='staff',
                sortDir=${sortBy == 'staff' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Staff
                <span th:if="${sortBy == 'staff'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Floor</th>

        <th>
            <a th:href="@{/assignments(
                shift=${shift},
                sortBy='shift',
                sortDir=${sortBy == 'shift' and sortDir == 'asc' ? 'desc' : 'asc'}
            )}">
                Shift
                <span th:if="${sortBy == 'shift'}"
                      th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
            </a>
        </th>

        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${assignments}">
        <td th:text="${a.staff != null ? a.staff.name : 'N/A'}"></td>
        <td th:text="${a.floor != null ? a.floor.level : 'N/A'}"></td>
        <td th:text="${a.shift}"></td>
        <td>
            <a th:href="@{/assignments/{id}(id=${a.id})}" class="button">Details</a>
            <a th:href="@{/assignments/{id}/edit(id=${a.id})}" class="button">Edit</a>
            <form th:action="@{/assignments/{id}/delete(id=${a.id})}"
                  method="post" style="display:inline">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
